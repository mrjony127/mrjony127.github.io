
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JONY PROJECTS</title>
<meta name="theme-color" content="#080808">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: #ff3030;
}

.subtitle {
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    margin-top: 10px;
    margin-bottom: 45px;
}

.folders {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.folder {
    text-decoration: none;
    color: white;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 28px 12px;
    transition: .25s;
    cursor: pointer;
}

.folder:hover {
    transform: translateY(-6px);
    border-color: #ff3030;
    background: #1c1111;
}

.folder-icon {
    font-size: 55px;
    margin-bottom: 15px;
    filter: drop-shadow(0 4px 10px #000);
}

.folder h3 {
    font-size: 15px;
    letter-spacing: 1px;
}

.folder p {
    color: #777;
    font-size: 11px;
    margin-top: 8px;
}

.footer {
    color: #555;
    font-size: 11px;
    margin-top: 50px;
    letter-spacing: 2px;
}

@media (max-width: 350px) {
    .folders {
        gap: 12px;
    }
    .folder {
        padding: 22px 8px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">JONY<span> PROJECTS</span></div>
    <div class="subtitle">MY WEBSITE COLLECTION</div>

    <div class="folders">

        <a class="folder"
           href="https://mrjony127.github.io/onlinedatabase.io/">
            <div class="folder-icon">📁</div>
            <h3>ONLINE DATABASE</h3>
            <p>Open Website ↗</p>
        </a>

        <a class="folder"
           href="https://mrjony127.github.io/TEST.COM/">
            <div class="folder-icon">📁</div>
            <h3>TEST.COM</h3>
            <p>Open Website ↗</p>
        </a>

        <a class="folder"
           href="https://mrjony127.github.io/JONYMAILWEB/">
            <div class="folder-icon">📁</div>
            <h3>JONY MAIL</h3>
            <p>Open Website ↗</p>
        </a>

    </div>

    <div class="footer">
        © 2026 JONY AHMED
    </div>

</div>

</body>
</html>
