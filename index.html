<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JONY PROJECTS</title>
<meta name="theme-color" content="#080808">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #060606;
    color: #fff;
    font-family: 'Inter', 'Segoe UI', -apple-system, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,48,48,0.15) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
}

.container {
    width: 100%;
    max-width: 460px;
    text-align: center;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.35s ease-out;
}

/* ===== HEADER ===== */
.brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    background: rgba(255,48,48,0.08);
    border: 1px solid rgba(255,48,48,0.2);
    border-radius: 100px;
    margin-bottom: 18px;
    animation: slideDown 0.3s ease-out;
}

.brandDot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff3030;
    box-shadow: 0 0 10px #ff3030;
}

.brandText {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #ff6060;
    text-transform: uppercase;
}

.logo {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fff 0%, #999 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.logo em {
    font-style: normal;
    background: linear-gradient(135deg, #ff3030, #ff7070);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.subtitle {
    color: #555;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 32px;
    text-transform: uppercase;
    font-weight: 500;
    animation: fadeIn 0.4s ease-out;
}

/* ===== LOCK SCREEN ===== */
#lockScreen {
    background: rgba(20,20,20,0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 24px;
    padding: 36px 28px;
    position: relative;
    overflow: hidden;
    animation: popIn 0.35s ease-out;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
}

#lockScreen::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,48,48,0.5), transparent);
}

.lockBadge {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(255,48,48,0.15), rgba(255,48,48,0.05));
    border: 1px solid rgba(255,48,48,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 8px 32px rgba(255,48,48,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
}

#lockScreen h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
}

#lockScreen p {
    color: #777;
    font-size: 13px;
    margin-bottom: 24px;
    line-height: 1.5;
}

.inputWrap {
    position: relative;
    margin-bottom: 12px;
}

.inputWrap::before {
    content: '🔑';
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.5;
    pointer-events: none;
}

#passwordInput {
    width: 100%;
    padding: 15px 16px 15px 46px;
    background: rgba(10,10,10,0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    color: #fff;
    outline: none;
    font-size: 15px;
    letter-spacing: 1px;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    font-family: inherit;
}

#passwordInput::placeholder {
    color: #444;
    letter-spacing: 0;
}

#passwordInput:focus {
    border-color: rgba(255,48,48,0.5);
    background: rgba(15,15,15,0.9);
    box-shadow: 0 0 0 3px rgba(255,48,48,0.08);
}

#unlockBtn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #ff3030 0%, #cc1f1f 100%);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
    box-shadow: 0 6px 20px rgba(255,48,48,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
}

#unlockBtn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(255,48,48,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
}

#unlockBtn:active {
    transform: scale(0.98);
}

#error {
    color: #ff5555;
    font-size: 12.5px;
    margin-top: 12px;
    min-height: 16px;
    font-weight: 500;
}

/* ===== DASHBOARD ===== */
#dashboard {
    display: none;
}

.dashHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 0 4px;
}

.dashTitle {
    font-size: 13px;
    color: #888;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
}

.dashCount {
    font-size: 11px;
    color: #ff6060;
    background: rgba(255,48,48,0.1);
    border: 1px solid rgba(255,48,48,0.2);
    padding: 4px 12px;
    border-radius: 100px;
    font-weight: 700;
}

.folders {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.folder {
    padding: 18px 16px;
    border-radius: 18px;
    background: rgba(22,22,22,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    text-decoration: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease-out, border-color 0.15s, background 0.15s, box-shadow 0.15s;
    animation: folderPop 0.3s ease-out both;
}

.folder:nth-child(1) { animation-delay: 0s; }
.folder:nth-child(2) { animation-delay: 0.04s; }
.folder:nth-child(3) { animation-delay: 0.08s; }
.folder:nth-child(4) { animation-delay: 0.12s; }
.folder:nth-child(5) { animation-delay: 0.16s; }

.folder::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 0%, rgba(255,48,48,0.12), transparent 60%);
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
}

.folder:hover {
    transform: translateY(-3px);
    border-color: rgba(255,48,48,0.35);
    background: rgba(28,28,28,0.9);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.folder:hover::before {
    opacity: 1;
}

.folderIcon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, rgba(255,48,48,0.15), rgba(255,48,48,0.05));
    border: 1px solid rgba(255,48,48,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    margin-bottom: 12px;
    transition: transform 0.15s ease-out, background 0.15s, border-color 0.15s;
}

.folder:hover .folderIcon {
    transform: scale(1.08);
    background: linear-gradient(135deg, rgba(255,48,48,0.3), rgba(255,48,48,0.15));
    border-color: rgba(255,48,48,0.5);
}

.folder h3 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
    position: relative;
    z-index: 1;
    line-height: 1.3;
}

.folder p {
    font-size: 10px;
    color: #666;
    position: relative;
    z-index: 1;
    transition: color 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
}

.folder p::after {
    content: '→';
    transition: transform 0.15s;
}

.folder:hover p {
    color: #ff6060;
}

.folder:hover p::after {
    transform: translateX(3px);
}

/* ===== LOGOUT ===== */
#logoutBtn {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    background: rgba(255,255,255,0.03);
    color: #888;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    font-family: inherit;
    text-transform: uppercase;
}

#logoutBtn:hover {
    color: #ff4545;
    border-color: rgba(255,48,48,0.4);
    background: rgba(255,48,48,0.06);
}

#logoutBtn:active {
    transform: scale(0.99);
}

/* ===== FOOTER ===== */
.footer {
    color: #333;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 28px;
    text-transform: uppercase;
    font-weight: 600;
    animation: fadeIn 0.4s ease-out;
}

/* ===== FAST ANIMATIONS ===== */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}

@keyframes popIn {
    from { opacity: 0; transform: scale(0.97) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes folderPop {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    50%      { transform: translateX(6px); }
    75%      { transform: translateX(-3px); }
}

.shake {
    animation: shake 0.25s ease;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 420px) {
    .logo { font-size: 30px; }
    #lockScreen { padding: 30px 22px; }
    body::before { width: 400px; height: 400px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">
        <span class="brandDot"></span>
        <span class="brandText">Private Access</span>
    </div>

    <div class="logo">JONY <em>PROJECTS</em></div>
    <div class="subtitle">My Website Collection</div>

    <!-- PASSWORD SCREEN -->
    <div id="lockScreen">
        <div class="lockBadge">🔐</div>
        <h2>Welcome Back</h2>
        <p>Enter your password to access your projects</p>

        <div class="inputWrap">
            <input
                type="password"
                id="passwordInput"
                placeholder="Enter Password"
                autocomplete="off"
            >
        </div>

        <button id="unlockBtn" onclick="unlockWebsite()">
            UNLOCK
        </button>

        <div id="error"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <div class="dashHeader">
            <span class="dashTitle">Projects</span>
            <span class="dashCount">5 Active</span>
        </div>

        <div class="folders">

            <a class="folder" href="https://mrjony127.github.io/onlinedatabase.io/">
                <div class="folderIcon">📁</div>
                <h3>ONLINE DATABASE</h3>
                <p>Open Website</p>
            </a>

            <a class="folder" href="https://mrjony127.github.io/TEST.COM/">
                <div class="folderIcon">📁</div>
                <h3>TEST.COM</h3>
                <p>Open Website</p>
            </a>

            <a class="folder" href="https://mrjony127.github.io/JONYMAILWEB/">
                <div class="folderIcon">✉️</div>
                <h3>JONY MAIL</h3>
                <p>Open Website</p>
            </a>

            <a class="folder" href="https://mrjony127.github.io/PRONHUB-BD/">
                <div class="folderIcon">🔞</div>
                <h3>18+ ZONE</h3>
                <p>Open Website</p>
            </a>

            <a class="folder" href="https://mrjony127.github.io/mrjony128.github.io/">
                <div class="folderIcon">✨</div>
                <h3>PARSONAL WEB SITE</h3>
                <p>Open Website</p>
            </a>

        </div>

        <button id="logoutBtn" onclick="logout()">
            Lock Now
        </button>
    </div>

    <div class="footer">
        © 2026 Jony Ahmed
    </div>

</div>

<script>
const PASSWORD = "mrjony127@";
const SESSION_TIME = 10 * 60 * 60 * 1000;
const STORAGE_KEY = "jony_projects_unlock_time";

function unlockWebsite() {
    const entered = document.getElementById("passwordInput").value;
    const errorEl = document.getElementById("error");
    const inputEl = document.getElementById("passwordInput");

    if (entered === PASSWORD) {
        localStorage.setItem(STORAGE_KEY, Date.now().toString());
        errorEl.textContent = "";
        showDashboard();
    } else {
        errorEl.textContent = "Wrong Password! Try Again.";
        inputEl.value = "";
        inputEl.classList.add("shake");
        setTimeout(() => inputEl.classList.remove("shake"), 250);
    }
}

function showDashboard() {
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
}

function logout() {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
}

function checkSession() {
    const savedTime = Number(localStorage.getItem(STORAGE_KEY));
    if (savedTime && Date.now() - savedTime < SESSION_TIME) {
        showDashboard();
    } else {
        localStorage.removeItem(STORAGE_KEY);
    }
}

document.getElementById("passwordInput")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            unlockWebsite();
        }
    });

checkSession();
</script>

</body>
</html>
